# Grafana dashboards (GitOps)
# ConfigMaps met label grafana_dashboard: "1" worden door de Grafana sidecar
# in kube-prometheus-stack automatisch geladen.
# Voeg hier extra dashboard-ConfigMaps toe; data key = bestandsnaam, value = dashboard-JSON.

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-node-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_dashboard_folder: "Monitoring"
data:
  node-overview.json: |
