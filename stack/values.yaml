# Helm values voor kube-prometheus-stack (één monitoring-stack)
# Bevat: prometheus, alertmanager, grafana, prometheus-operator, defaultRules, additionalServiceMonitors

prometheus:
  prometheusSpec:
    evaluationInterval: 30s
    scrapeInterval: 30s
    ruleSelector:
      matchLabels:
        release: mon
    ruleNamespaceSelector: {}
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: 2
        memory: 4Gi 
defaultRules:
  disabled:
    KubeClientCertificateExpiration: true
alertmanager:
  config:
    route:
      receiver: team-platform-slack
      group_by: [namespace, alertname]
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 2h
      routes:
      - matchers: ["alertname=InfoInhibitor"]
        receiver: blackhole
        continue: false
      - matchers: ["severity=info"]
        receiver: blackhole
        continue: false
      - matchers: ["alertname=DeploymentUnhealthy"]
        receiver: ops-autofix
        continue: true
      - matchers: ["alertname=NodeDiskIOSaturation"]
        receiver: team-platform-slack
        group_interval: 30m
        repeat_interval: 24h
        continue: false
      - matchers: ["alertname=CreateContainerConfigError"]
        receiver: ops-autofix
        continue: true
    receivers:
    - name: blackhole
    - name: team-platform-slack
      slack_configs:
      - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/slack_webhook
        title: '{{ template "slack.mon.title" . }}'
        title_link: '{{ template "slack.mon.titlelink" . }}'
        text: '{{ template "slack.mon.text" . }}'
        footer: '{{ template "slack.mon.footer" . }}'
        fields:
        - title: Namespace
          value: '{{ .CommonLabels.namespace | default "-" }}'
          short: true
        - title: Pod
          value: '{{ .CommonLabels.pod | default "-" }}'
          short: true
        - title: Container
          value: '{{ .CommonLabels.container | default "-" }}'
          short: true
        - title: Node
          value: '{{ .CommonLabels.node | default "-" }}'
          short: true
        send_resolved: true
    - name: ops-autofix
      webhook_configs:
      - url: http://alertmanager-eventsource-svc.argo-events.svc.cluster.local:12000/alertmanager
        send_resolved: false
  alertmanagerSpec:
    replicas: 2
    secrets:
    - alertmanager-slack-webhook
    logLevel: info
    configSecret: alertmanager-managed-config
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
  templateFiles:
    slack.tmpl: |
      {{ define "slack.mon.title" }}[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}{{ end }}
      {{ define "slack.mon.titlelink" }}https://github.com/ConductionNL/monitoring/blob/main/docs/rules/{{ .CommonLabels.alertname }}.md{{ end }}
      {{ define "slack.mon.text" }}{{ if .CommonAnnotations.summary }}{{ .CommonAnnotations.summary }}{{ else }}Alert {{ .CommonLabels.alertname }} fired.{{ end }}{{ if .CommonAnnotations.description }}\n{{ .CommonAnnotations.description }}{{ end }}{{ end }}
      {{ define "slack.mon.footer" }}severity={{ .CommonLabels.severity | default "-" }} • receiver={{ .Receiver }}{{ end }}
grafana:
  enabled: true

  # Keycloak Generic OAuth – alleen actief als Secret grafana-keycloak-oauth bestaat.
  # Zonder dat Secret: laat deze twee regels uit of comment ze uit tot je ./scripts/grafana-oauth-secret.sh hebt gedraaid.
  # envFromSecret: grafana-keycloak-oauth
  #
  # grafana.ini (Keycloak): uncomment de onderstaande block + envFromSecret hierboven als Keycloak klaar is.
  # grafana.ini:
  #   server:
  #     root_url: https://grafana.commonground.nu/
  #   auth.generic_oauth:
  #     enabled: true
  #     name: Keycloak
  #     allow_sign_up: true
  #     scopes: openid email profile
  #     auth_url: https://iam.commonground.nu/realms/Grafana/protocol/openid-connect/auth
  #     token_url: https://iam.commonground.nu/realms/Grafana/protocol/openid-connect/token
  #     api_url: https://iam.commonground.nu/realms/Grafana/protocol/openid-connect/userinfo
  #     use_pkce: true
  #     email_attribute_path: email
  #     login_attribute_path: preferred_username
  #     name_attribute_path: name
  #
  # client_id en client_secret uit Secret (GF_AUTH_GENERIC_OAUTH_*). Zie grafana/.env.example en grafana/README.md.

  # Zonder Keycloak: basis-root_url (optioneel)
  grafana.ini:
    server:
      root_url: https://grafana.commonground.nu/

  # Datasource expliciet in Git (GitOps): Prometheus-URL vastgelegd in values
  # defaultDatasourceEnabled: false om conflict te voorkomen (chart maakt al een default aan)
  sidecar:
    datasources:
      enabled: true
      defaultDatasourceEnabled: false
      url: http://mon-kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"

  persistence:
    enabled: false
    size: 5Gi

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi 

  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.commonground.nu
    path: /
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.commonground.nu
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
   
prometheusOperator:
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
additionalServiceMonitors:
  - name: kube-proxy
    namespace: monitoring
    labels:
      release: mon
    endpoints:
      - port: metrics
        scheme: http
        interval: 30s
        scrapeTimeout: 10s
        relabelings:
          - action: replace
            targetLabel: job
            replacement: kube-proxy
    namespaceSelector:
      matchNames:
        - kube-system
    selector:
      matchLabels:
        app: kubernetes
        role: proxy
