apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
  # 1. Loki Helm chart met values uit Git
  - repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.29.0
    helm:
      releaseName: loki
      valueFiles:
      - $values/loki/values.yaml
  # 2. Alloy Helm chart met values uit Git
  - repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    # Vooraf gecontroleerd bij de bump naar 1.11.1 (2026-08-12), zie CHANGELOG:
    # onze vier values-instellingen overleven de chart-major, de config is
    # geldig tegen de alloy-binary v1.18.1, en quay.io is bereikbaar voor de
    # nieuwe reloader-sidecar. Loki blijft bewust op 6.29.0: die bump is een
    # aparte stap met huiswerk op schemaConfig.
    targetRevision: 1.11.1
    helm:
      releaseName: alloy
      valueFiles:
      - $values/loki/alloy-values.yaml
  # 3. Git ref voor Helm values
  - repoURL: https://github.com/ConductionNL/monitoring.git
    targetRevision: main
    ref: values
  # 4. Plain manifests uit loki/: datasource, Alloy-config en alertregels.
  #    De twee values-bestanden horen bij bron 1 en 2 en zijn uitgesloten.
  #
  #    De SOPS-secret is óók uitgesloten, en dat is geen detail: deze Argo CD
  #    ontsleutelt géén sops. Gecontroleerd op 2026-08-10 — de enige
  #    configManagementPlugin is `helmfile`, er is geen age-sleutel in de
  #    namespace argocd en de repo-server heeft geen sops-env. Zou het bestand
  #    hier wél in staan, dan applyt Argo het letterlijk en krijgt Loki een
  #    Secret met `ENC[AES256_GCM,...]` als wachtwoord. Dat is de fout van
  #    2026-07-13 (applybaar voorbeeldbestand overschreef werkende secrets),
  #    en de reden dat alerting/secret-alertmanager.sops.yaml 100% commentaar
  #    is in plaats van applybaar.
  #
  #    loki-s3-credentials is dus een bootstrap-secret dat een mens plaatst:
  #      kubectl -n monitoring apply -f <(sops -d loki/secret-loki-s3.sops.yaml)
  - repoURL: https://github.com/ConductionNL/monitoring.git
    targetRevision: main
    path: loki
    directory:
      recurse: true
      exclude: '{values.yaml,alloy-values.yaml,secret-*.sops.yaml}'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
    - ServerSideApply=true
