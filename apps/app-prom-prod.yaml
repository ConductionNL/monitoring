apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mon
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
  - repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 77.5.0
    helm:
      skipCrds: true
      releaseName: mon
      valueFiles:
      - $values/stack/values.yaml
  - repoURL: https://codeberg.org/Conduction/monitoring.git
    targetRevision: main
    ref: values
  - repoURL: https://codeberg.org/Conduction/monitoring.git
    targetRevision: main
    path: prometheus/rules/coredns
  - repoURL: https://codeberg.org/Conduction/monitoring.git
    targetRevision: main
    path: prometheus/rules/pods
  - repoURL: https://codeberg.org/Conduction/monitoring.git
    targetRevision: main
    path: alerting
    directory:
      recurse: true
  - repoURL: https://codeberg.org/Conduction/monitoring.git
    targetRevision: main
    path: prometheus/rules/images
  - repoURL: https://codeberg.org/Conduction/monitoring.git
    targetRevision: main
    path: prometheus/rules/storage
  - repoURL: https://codeberg.org/Conduction/monitoring.git
    targetRevision: main
    path: prometheus/rules/ingress
  - repoURL: https://codeberg.org/Conduction/monitoring.git
    targetRevision: main
    path: prometheus/rules/certmanager
  - repoURL: https://codeberg.org/Conduction/monitoring.git
    targetRevision: main
    path: prometheus/rules/hpa
  - repoURL: https://codeberg.org/Conduction/monitoring.git
    targetRevision: main
    path: prometheus/rules/deploy
  - repoURL: https://codeberg.org/Conduction/monitoring.git
    targetRevision: main
    path: prometheus/rules/nextcloud
  - repoURL: https://codeberg.org/Conduction/monitoring.git
    targetRevision: main
    path: grafana/dashboards
  - repoURL: https://codeberg.org/Conduction/monitoring.git
    targetRevision: main
    path: servicemonitors
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
    - ServerSideApply=true
