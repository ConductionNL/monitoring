apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mon-argocd-credential-refresh
  namespace: monitoring
  labels: { release: mon }
spec:
  groups:
  - name: argocd.credentialrefresh.rules
    rules:
    # De CronJob argocd-credential-refresh (namespace argocd, elke 12u) haalt
    # verse 24-uurs-kubeconfigs voor de shoot-clusters op. Valt hij stil, dan
    # verliest Argo CD binnen 24u de toegang tot alles wat het beheert.
    # 14u drempel = de 12u-schedule plus marge voor een enkele overslaande run.
    - alert: ArgoCDCredentialRefreshStale
      expr: time() - kube_cronjob_status_last_successful_time{namespace="argocd", cronjob="argocd-credential-refresh"} > 14 * 3600
      for: 15m
      labels: { severity: critical, team: platform }
      annotations:
        summary: "Argo CD credential-refresh staat stil ({{ $value | humanizeDuration }} sinds laatste succes)"
        description: "Argo CD verliest binnen 24u de toegang tot con-prod, conductionprod en test-accept. Meestal een verlopen Gardener-token. Runbook: docs/rules/ArgoCDCredentialRefreshStale.md."

    - alert: ArgoCDCredentialRefreshJobFailed
      expr: kube_job_failed{namespace="argocd", job_name=~"argocd-credential-refresh-.*", condition="true"} > 0
      for: 5m
      labels: { severity: warning, team: platform }
      annotations:
        summary: "Argo CD credential-refresh-job gefaald: {{ $labels.job_name }}"
        description: "Bekijk de pod-logs van de job (restartPolicy Never, dus de pod blijft staan). Runbook: docs/rules/ArgoCDCredentialRefreshJobFailed.md."
