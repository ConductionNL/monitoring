apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mon-pvc-usage-high
  namespace: monitoring
  labels: { release: mon }
spec:
  groups:
  - name: pvc.usage.rules
    rules:
    - alert: PVCUsageHigh
      expr: (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes) < 0.10
      for: 15m
      labels: { severity: warning, team: platform }
      annotations:
        summary: "PVC bijna vol: {{ $labels.persistentvolumeclaim }} ({{ $labels.namespace }})"
        description: "Beschikbare ruimte <10%. Ruim op of vergroot volume."

