apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mon-pod-pending-long
  namespace: monitoring
  labels: { release: mon }
spec:
  groups:
  - name: pods.pending.rules
    rules:
    - alert: PodPendingLong
      expr: sum by (namespace,pod) (kube_pod_status_phase{phase="Pending"} == 1) > 0
      for: 10m
      labels: { severity: warning, team: platform }
      annotations:
        summary: "Pod pending >10m: {{ $labels.namespace }}/{{ $labels.pod }}"
        description: "Controleer scheduling events, resources, node selectors/taints en image pulls."

