apiVersion: v1
kind: ConfigMap
metadata:
  name: mon-kube-prometheus-stack-alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
data:
  alertmanager.yaml: |
    route:
      receiver: team-platform-slack
      group_by: ['namespace','alertname']
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 2h
    receivers:
    - name: team-platform-slack
      slack_configs:
      - channel: "#k8s-alerts"
        api_url_file: /etc/alertmanager/secrets/slack_webhook
        send_resolved: true
