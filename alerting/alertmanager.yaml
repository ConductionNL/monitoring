apiVersion: v1
kind: ConfigMap
metadata:
  name: mon-kube-prometheus-stack-alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
data:
  alertmanager.yaml: |
    route:
      receiver: team-platform-slack
      group_by: ['namespace','alertname']
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 2h
      routes:
      - matchers:
        - alertname = CreateContainerConfigError
        receiver: ops-autofix
        continue: true
    receivers:
    - name: team-platform-slack
      slack_configs:
      - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/slack_webhook
        send_resolved: true
    - name: ops-autofix
      webhook_configs:
      - url: http://alertmanager-eventsource-svc.argo-events.svc.cluster.local:12000/alertmanager
        send_resolved: false
