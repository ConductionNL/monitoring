apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: alertmanager
  namespace: argo-events
spec:
  eventBusName: default
  service:
    ports:
    - port: 12000
      targetPort: 12000
  webhook:
    alertmanager:
      port: "12000"
      endpoint: /alertmanager
      method: POST

