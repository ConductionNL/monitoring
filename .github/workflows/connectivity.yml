name: Connectivity Smoke

on:
  push:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait 5 minutes (post-push)
        run: sleep 300

      - name: Setup kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBE_CONFIG" | base64 -d > $HOME/.kube/config
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_BASE64 }}

      - name: Slack smoke
        run: |
          kubectl -n monitoring create -f tests/connectivity/job-slack-smoke.yaml
          kubectl -n monitoring wait --for=condition=complete job -l app=connectivity-smoke --timeout=120s

      - name: Egress/DNS smoke
        run: |
          kubectl -n monitoring create -f tests/connectivity/job-egress-dns.yaml
          kubectl -n monitoring wait --for=condition=complete job -l app=connectivity-smoke --timeout=120s

      - name: Argo app status
        run: |
          kubectl -n argocd get application mon -o jsonpath='{.status.sync.status} {.status.health.status}\n'

