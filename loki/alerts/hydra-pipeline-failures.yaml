apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-loki-rules
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  loki-alert-rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: loki-log-alerts
        folder: Loki
        interval: 1m
        rules:
          - uid: hydra-pipeline-failure
            title: HydraPipelineFailure
            condition: log_query
            data:
              - refId: log_query
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: loki
                model:
                  expr: >-
                    count_over_time(
                      {namespace=~"hydra.*"}
                      |= "ERROR"
                      |= "pipeline"
                      [5m]
                    )
                  queryType: range
              - refId: threshold
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "-100"
                model:
                  type: threshold
                  conditions:
                    - evaluator:
                        type: gt
                        params: [0]
                      operator:
                        type: and
                      reducer:
                        type: last
            for: 5m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: >-
                Hydra pipeline errors detected in {{ $labels.namespace }}
              description: >-
                Pod {{ $labels.pod }} in namespace {{ $labels.namespace }}
                is logging pipeline ERROR lines. Check logs in Grafana Explore
                with: {namespace="{{ $labels.namespace }}", pod="{{ $labels.pod }}"} |= "ERROR"
              runbook_url: >-
                https://github.com/ConductionNL/monitoring/blob/main/docs/rules/HydraPipelineFailure.md
            noDataState: OK
            execErrState: Error
            # notification_settings:
            #   receiver: team-platform-slack
            # TODO: Activeer zodra Grafana Slack contact point is ingericht
