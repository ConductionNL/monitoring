# Helm values voor grafana/loki chart
# Deployt Loki in SingleBinary mode binnen monitoring namespace
# Chart: https://grafana.github.io/helm-charts (grafana/loki)

# -- SingleBinary: alle componenten in één pod (eenvoudigst, voldoende tot
# ~20 GB/dag). Schakel over naar SimpleScalable als het ingestievolume groeit:
# zet `singleBinary.replicas` op 0 en read/write/backend omhoog.
#
# LET OP: deze sleutel hoort op TOPNIVEAU, niet onder `loki:`. Stond hij daar
# (t/m 2026-08-10), dan las de chart hem niet, viel hij terug op de default
# SimpleScalable, en rolde hij met read/write/backend op 0 alleen de
# memcached-caches uit — Loki zelf startte nooit. De chart rendert dan wél
# zonder fout, dus `helm template` alleen is geen bewijs: controleer dat er een
# StatefulSet `loki` met replicas 1 in de output staat.
deploymentMode: SingleBinary

loki:
  auth_enabled: false

  # -- Replicatiefactor op 1. Verplicht bij SingleBinary: de chart-default is 3
  # en dan kan de ring die factor met één ingester nooit halen. Loki komt dan
  # wél omhoog en /ready geeft 200, maar élke query faalt met
  # `500 too many unhealthy instances in the ring` — terwijl /ring precies één
  # ACTIVE instance toont. Aangetoond op 2026-08-11 bij de eerste uitrol.
  # Zet dit mee omhoog als je naar SimpleScalable gaat met 3+ ingesters.
  commonConfig:
    replication_factor: 1

  # -- Opslag: S3 (Fuga Cloud / Ceph RGW), bucket `loki-chunks`.
  #
  # De filesystem-tussenstand van 2026-08-10/11 is hier vervangen. Die stond er
  # omdat de enige beschikbare S3-sleutel die van de Nextcloud-tenants is en ik
  # aannam dat daar klantdata in zat. Dat is nagetrokken en onjuist: er staan
  # **nul** objectstore-ConfigMaps in het cluster, `canary-overrides.yaml` noemt
  # de S3-objectstore "IN VALIDATION on canary-prod", en klantdata leeft in
  # Postgres. Het bezwaar rustte dus op documentatie in plaats van op de
  # werkelijkheid.
  #
  # LET OP het schema. Dit is het *chart*-schema, niet dat van Loki's eigen
  # config: de bucketnamen staan onder `storage.bucketNames` (camelCase, apart
  # per gebruik) en de sleutels heten `accessKeyId`/`secretAccessKey`. De
  # eerdere vorm (`s3.bucketnames`, `access_key_id`) is die van loki.yaml zelf
  # en liet de chart falen op `nil pointer evaluating interface {}.chunks`.
  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks
      # De ruler staat uit (zie `ruler.enabled` hieronder), maar de chart eist
      # dit veld; dezelfde bucket volstaat.
      ruler: loki-chunks
    s3:
      # Endpoint en region staan hier letterlijk: het zijn geen secrets (ze
      # staan ook in Nextcloud-base/nextcloud-platform/values/env/accept.yaml)
      # en zo hangen er twee placeholders minder aan de env-expansie. Vorm:
      # host:port zonder schema — met `insecure: false` maakt Loki daar
      # https://core.fuga.cloud:8080 van. Bewezen werkend met `aws s3 ls`
      # tegen ditzelfde endpoint op 2026-08-11.
      endpoint: core.fuga.cloud:8080
      region: us-east-1
      # Alleen de sleutels komen uit het secret, via env-expansie. Dat vergt
      # `-config.expand-env=true` in singleBinary.extraArgs — zie daar.
      accessKeyId: ${AWS_ACCESS_KEY_ID}
      secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
      s3ForcePathStyle: true            # vereist voor Ceph/Fuga
      insecure: false

  # -- Filesystem-variant, voor als je terug moet. Zet dan ook
  # schemaConfig.object_store en compactor.delete_request_store terug, en zet
  # extraEnvFrom uit — vier plekken, zie het blok onderaan dit bestand.
  # storage:
  #   type: filesystem
  #   filesystem:
  #     chunks_directory: /var/loki/chunks
  #     rules_directory: /var/loki/rules

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        # Hoort bij storage.type hierboven; mee omzetten bij een wissel.
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h

  # -- Retentie: standaard 7 dagen, pas aan naar behoefte
  # Verhoog voor audit/compliance, verlaag om opslagkosten te beperken
  limits_config:
    retention_period: 168h            # 7 dagen
    max_query_series: 500
    max_query_parallelism: 2

  compactor:
    retention_enabled: true
    working_directory: /var/loki/compactor
    # Hoort bij storage.type hierboven; mee omzetten bij een wissel.
    delete_request_store: s3

  # -- Ruler uitgeschakeld: alle alerting gaat via Grafana Unified Alerting
  ruler:
    enabled: false

# -- SingleBinary replica's en resources
# -- SimpleScalable-targets expliciet op nul. De chart-defaults zetten read,
# write en backend op replicas > 0; samen met singleBinary.replicas: 1 valt hij
# dan over zijn eigen validatie ("more than zero replicas configured for both
# the single binary and simple scalable targets"). Wie later naar
# SimpleScalable wil, zet singleBinary op 0 en deze drie omhoog.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

singleBinary:
  replicas: 1

  # -- Env-expansie aanzetten. Zonder deze vlag zet Loki `${AWS_ACCESS_KEY_ID}`
  # letterlijk in zijn config en faalt elke S3-call. Aangetoond op 2026-08-11:
  # met de vlag op `global.extraArgs` kreeg de container hem NIET, elke
  # S3-request gaf 500 en de ingester logde
  # `InvalidEndpointURL: parse "https://${S3_ENDPOINT}": invalid character "{"`.
  #
  # LET OP de nestingsdiepte: `global.extraArgs` en `loki.extraArgs` worden
  # allebei genegeerd — beide getest met `helm template`. Alleen de
  # per-component vorm landt op de container. Ga je naar SimpleScalable, dan
  # moet deze vlag onder `write`, `read` én `backend`.
  extraArgs:
    - "-config.expand-env=true"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi
  persistence:
    enabled: true
    size: 10Gi

  # -- S3-credentials uit Kubernetes Secret. Levert ${S3_ENDPOINT}, ${S3_REGION}
  # en de AWS-sleutels aan de storage-config hierboven; zonder dit blijven die
  # placeholders letterlijk staan en faalt elke S3-call.
  #
  # LET OP de nestingsdiepte: dit hoort onder `singleBinary`, per component. Op
  # topniveau (zoals t/m 2026-08-11) én onder `loki:` wordt het stil genegeerd —
  # beide getest met `helm template`: de pod kreeg dan géén `envFrom`. Ga je naar
  # SimpleScalable, dan moet ditzelfde blok onder `write`, `read` en `backend`.
  #
  # Het secret is een bootstrap-secret dat een mens plaatst; Argo ontsleutelt de
  # sops-file niet. Zie docs/index.md.
  extraEnvFrom:
    - secretRef:
        name: loki-s3-credentials

# -- Gateway uitschakelen (intern cluster-verkeer, geen externe toegang nodig)
gateway:
  enabled: false

# -- Memcached-caches blijven uit, ook op S3. Ze dempen leeslatentie naar object
# storage, dus op S3 hebben ze wél nut — maar de chart-defaults vragen 9830Mi
# voor de chunks-cache en 1229Mi voor de results-cache, requests én limits. Dat
# is te veel om er stilzwijgend in te laten glijden. Aanzetten is een bewuste
# tuningstap: zet `chunksCache.allocatedMemory` op een gekozen waarde, en meet
# eerst of de querylatentie er om vraagt.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# -- Monitoring: serviceMonitor voor Loki zelf (optioneel, Prometheus scrapet Loki-metrics)
monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: mon

# -- Test pod uitschakelen
test:
  enabled: false

# ---------------------------------------------------------------------------
# Wisselen tussen S3 en filesystem — vier plekken, niet één
# ---------------------------------------------------------------------------
# Vergeet je er één, dan start Loki wél maar schrijft hij naar de verkeerde
# plek of valt hij om op een ontbrekend veld. De vier:
#
#   1. `loki.storage`             — één blok aan, het andere uit
#   2. `loki.schemaConfig`        — object_store: s3 <-> filesystem
#   3. `loki.compactor`           — delete_request_store: s3 <-> filesystem
#   4. `extraEnvFrom` (onderaan)  — aan voor S3 (levert ${S3_ENDPOINT} en de
#                                   sleutels), uit voor filesystem
#
# Vereist voor de S3-stand: de bucket `loki-chunks` bestaat, en het bootstrap-secret
# `loki-s3-credentials` staat in namespace monitoring (Argo plaatst dat niet —
# zie apps/app-loki-prod.yaml en docs/index.md).
#
# Nog onbeproefd op deze S3: `S3_ENDPOINT` zonder schema
# (`core.fuga.cloud:8080`) en `S3_REGION: us-east-1`. De Nextcloud-tenants
# gebruiken `https://…:8080` en een leeg region. Klaagt de pod over endpoint of
# region, dan zijn dat de eerste twee knoppen — die waarden zitten in het
# secret, niet in dit bestand.
#
# Controleer een wissel vóór de sync met:
#   helm template loki loki --repo https://grafana.github.io/helm-charts \
#     --version 6.29.0 -f loki/values.yaml >/dev/null
# en kijk daarna in de gerenderde ConfigMap of alle drie de storage-plekken
# dezelfde kant op staan.
#
# De PVC blijft ook op S3 nodig: daar staan de WAL en de index-cache. Wat er van
# de filesystem-periode aan chunks op staat verhuist níét mee naar S3.
