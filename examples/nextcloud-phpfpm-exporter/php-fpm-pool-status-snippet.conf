# Snippet voor je PHP-FPM pool-config (bijv. www.conf in je Nextcloud-image of ConfigMap).
# Nodig zodat de runtime-exporter (poort 9253) actief/idle/totaal kan uitlezen en de grafiek data krijgt.
#
# Toevoegen in de [www] (of je pool) sectie:
#
# Statuspagina voor de exporter
pm.status_path = /status
#
# Luister op TCP 9000 zodat de exporter (in een andere pod) kan verbinden.
# Als je nu alleen listen = /run/php-fpm.sock hebt, voeg dit toe of vervang tijdelijk voor test:
listen = 9000
listen.allowed_clients = 127.0.0.1
# In Kubernetes wil de exporter van buitenaf (andere pod) verbinden; dan bijv.:
# listen = 0.0.0.0:9000
# listen.allowed_clients = any
# of alleen het netwerk van de cluster toestaan.
#
# Na wijziging: pod/herstart van de Nextcloud/PHP-FPM container.
# Controleer: curl -s http://<nextcloud-pod-ip>:9000/status (of via Service nextcloud:9000).
