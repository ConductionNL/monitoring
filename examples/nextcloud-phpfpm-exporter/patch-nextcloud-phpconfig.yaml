# Patch voor ConfigMap nextcloud-phpconfig in vng-backend-test.
# Alleen listen aangepast: 127.0.0.1:9000 → 0.0.0.0:9000 zodat de phpfpm-exporter pod kan verbinden.
# Let op: bij volgende Argo-sync van de Nextcloud-app kan dit overschreven worden; zet dan in de Nextcloud Helm values dezelfde listen.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-phpconfig
  namespace: vng-backend-test
data:
  www.conf: |
    [www]
    user = www-data
    group = www-data
    listen = 0.0.0.0:9000

    pm = dynamic
    pm.max_children = 50
    pm.start_servers = 5
    pm.min_spare_servers = 5
    pm.max_spare_servers = 35
    pm.max_requests = 500

    ; PHP-FPM status endpoint (for monitoring; /status = wat Lusitaniae-exporter verwacht)
    pm.status_path = /status
    ping.path = /fpm-ping
    ping.response = pong

    ; PHP settings
    php_admin_value[memory_limit] = 2048M
    php_admin_value[upload_max_filesize] = 16G
    php_admin_value[post_max_size] = 16G
    php_admin_value[max_execution_time] = 3600
    php_admin_value[max_input_time] = 3600
    php_admin_value[output_buffering] = Off
